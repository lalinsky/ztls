name: test

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        zig: [0.16.0, 0.17.0]
        include:
          # Without AWS-LC's assembly, which needs NASM there: fetching
          # the nasm package keeps failing in CI; see #45.
          - os: windows-latest
            build_flags: -Dasm=false
          # The other targets AWS-LC's assembly is built for.
          - os: macos-15-intel
            zig: 0.17.0
          - os: windows-11-arm
            zig: 0.17.0
    runs-on: ${{ matrix.os }}
    name: Test (${{ matrix.os }}, zig ${{ matrix.zig }})
    steps:
      # Test data is embedded byte for byte; CRLF checkouts would change it.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ matrix.zig }}
      - run: zig build test ${{ matrix.build_flags }} --summary all
      - name: Test with libssl
        run: zig build test -Dimpl=libssl ${{ matrix.build_flags }} --summary all

  bogo:
    runs-on: ubuntu-latest
    name: BoGo
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: false
      - run: tests/bogo/run.sh

  tlsfuzzer:
    runs-on: ubuntu-latest
    name: tlsfuzzer
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: tests/tlsfuzzer/run.sh
